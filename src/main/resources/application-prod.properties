# Profil de production : activé par l'image Docker (SPRING_PROFILES_ACTIVE=prod).
# Les secrets et les adresses viennent des variables d'environnement (deploy/.env), jamais de ce fichier.

# La base : le conteneur postgres du même réseau Docker
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:thyrsio}
spring.datasource.username=thyrsio_app
spring.datasource.password=${THYRSIO_APP_PASSWORD}
spring.jpa.show-sql=false

# Keycloak, à son adresse publique (l'API la joint par le réseau Docker, sans sortir sur Internet)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH_DOMAIN}/realms/thyrsio
thyrsio.keycloak.admin.base-url=https://${AUTH_DOMAIN}

# Derrière Caddy : l'adresse et le protocole d'origine viennent des en-têtes X-Forwarded-*
server.forward-headers-strategy=framework

# Pas de documentation Swagger en production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Les adresses placées sur la carte (OpenStreetMap / Nominatim, 1 requête par seconde au plus)
thyrsio.geocoding.enabled=true
thyrsio.geocoding.user-agent=Thyrsio ERP (${APP_DOMAIN})

# Des journaux lisibles par docker compose logs
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
