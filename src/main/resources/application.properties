spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:thyrsio}
spring.datasource.username=thyrsio_app
spring.datasource.password=${THYRSIO_APP_PASSWORD}

# Flyway crée les tables, Hibernate vérifie seulement qu'elles correspondent aux entités
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Keycloak : Spring y télécharge la clé publique et vérifie que les tokens viennent de ce realm
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/thyrsio
# Refuse tout token qui n'est pas explicitement destiné à cette API
spring.security.oauth2.resourceserver.jwt.audiences=thyrsio-api

# Connexion depuis Swagger UI, via le client Keycloak avec PKCE
springdoc.swagger-ui.oauth.client-id=thyrsio-web
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# Client "thyrsio-api-admin" : permet à l'API d'appeler l'API d'administration de Keycloak
thyrsio.keycloak.admin.base-url=http://localhost:8180
thyrsio.keycloak.admin.realm=thyrsio
thyrsio.keycloak.admin.client-id=thyrsio-api-admin
thyrsio.keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}

# Si l'appli démarre un jour SANS le profil dev sur une base qui a reçu les données de démo,
# Flyway ne doit pas bloquer parce qu'il ne trouve plus ce script repeatable.
spring.flyway.ignore-migration-patterns=*:future,repeatable:missing

# Mises en bouteille : combien de jours avant une mise on est alerté de ses manquants
thyrsio.production.alert-days=10
