spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB:thyrsio}
spring.datasource.username=thyrsio_app
spring.datasource.password=${THYRSIO_APP_PASSWORD}

# Flyway crée les tables, Hibernate vérifie seulement qu'elles correspondent aux entités
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true