services:
  postgres:
    image: postgres:18
    container_name: thyrsio-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: thyrsio-keycloak
    restart: unless-stopped
    # Mode développement : HTTP autorisé, cache désactivé, démarrage rapide
    # --import-realm : importe les fichiers de /opt/keycloak/data/import au démarrage,
    # seulement si le realm n'existe pas encore (une config existante n'est jamais écrasée)
    command: start-dev --import-realm
    environment:
      # Compte administrateur de la console Keycloak (créé au premier démarrage)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Stockage dans la base "keycloak" du Postgres existant
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Utilisé par ${KEYCLOAK_ADMIN_CLIENT_SECRET} dans le fichier du realm
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      # 8180 côté machine : le port 8080 est déjà pris par ton API Spring
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmindata:/var/lib/pgadmin

  mailpit:
    image: axllent/mailpit:v1.28.1
    container_name: thyrsio-mailpit
    restart: unless-stopped
    ports:
      # Interface web pour lire les emails capturés : http://localhost:8025
      - "8025:8025"
    # Le port SMTP (1025) n'est pas exposé : seul Keycloak l'utilise, via le réseau Docker

volumes:
  pgdata:
  pgadmindata: